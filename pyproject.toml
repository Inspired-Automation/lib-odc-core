[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odc-core"
version = "0.12.0"
description = "Shared ODC (Online Data Collection) infrastructure used by every supplier project: job claiming, file allocation, file save, job-status update, and Microsoft Graph mail/OTP helpers."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Inspired Automation Team" }
]
dependencies = [
    "pyodbc>=5.3",
    "msal>=1.31",
    "requests>=2.32",
    "paramiko>=4.0,<6",
    "file-allocation-core @ https://github.com/Inspired-Automation/lib-file-allocation/releases/download/v0.1.0/file_allocation_core-0.1.0-py3-none-any.whl",
]

[project.urls]
Repository = "https://github.com/Inspired-Automation/lib-odc-core"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
